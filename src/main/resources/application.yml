server:
  port: 8088
  servlet:
    context-path: /tijiancms

spring:
  application:
    name: xxhealth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${XXHEALTH_DB_URL:jdbc:mysql://localhost:3306/health_check_system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${XXHEALTH_DB_USERNAME:root}
    password: ${XXHEALTH_DB_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd
  sql:
    init:
      encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.it.xxhealth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

logging:
  level:
    com.it.xxhealth.mapper: debug
