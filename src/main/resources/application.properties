spring.application.name=xxhealth
spring.datasource.url=${XXHEALTH_DB_URL:jdbc:mysql://localhost:3306/health_check_system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=${XXHEALTH_DB_USERNAME:root}
spring.datasource.password=${XXHEALTH_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd
