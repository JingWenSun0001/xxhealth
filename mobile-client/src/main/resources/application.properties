spring.application.name=xxhealth
server.port=8080
server.servlet.context-path=/tijian

spring.datasource.url=jdbc:mysql://localhost:3306/health_check_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=GMT+8

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
